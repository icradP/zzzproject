<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ZZZ IM messaging client.">
  <meta name="theme-color" content="#F5C542">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZZZ IM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ZZZ IM</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">
  <style>
    html,
    body {
      background: #050505;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #app-loading {
      align-items: center;
      background: #050505;
      display: flex;
      inset: 0;
      justify-content: center;
      opacity: 1;
      position: fixed;
      transition: opacity 180ms ease-out;
      z-index: 1000;
    }

    .flutter-ready #app-loading {
      opacity: 0;
      pointer-events: none;
    }

    #app-loading img {
      height: 72px;
      width: 72px;
    }

    #app-loading::after {
      animation: loading-spin 800ms linear infinite;
      border: 2px solid rgba(245, 197, 66, 0.22);
      border-radius: 50%;
      border-top-color: #f5c542;
      content: "";
      height: 92px;
      position: absolute;
      width: 92px;
    }

    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Loading ZZZ IM">
    <img src="icons/Icon-192.png" alt="">
  </div>
  <script src="push_client.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
