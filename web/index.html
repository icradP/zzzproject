<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ZZZ IM messaging client.">
  <meta name="theme-color" content="#F5C542">
  <meta name="zzz-performance-endpoint" content="/im/client-performance">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZZZ IM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ZZZ IM</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      background: #050505;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #app-loading {
      align-items: center;
      background: #050505;
      display: flex;
      inset: 0;
      justify-content: center;
      opacity: 1;
      padding: 28px;
      position: fixed;
      transition: opacity 180ms ease-out;
      z-index: 1000;
    }

    .flutter-ready #app-loading {
      opacity: 0;
      pointer-events: none;
    }

    .app-loading-content {
      align-items: center;
      display: flex;
      flex-direction: column;
      width: min(340px, 100%);
    }

    .app-loading-logo {
      height: 92px;
      margin-bottom: 22px;
      position: relative;
      width: 92px;
    }

    .app-loading-logo img {
      height: 64px;
      inset: 14px;
      position: absolute;
      width: 64px;
    }

    .app-loading-logo::after {
      animation: loading-spin 800ms linear infinite;
      border: 2px solid rgba(245, 197, 66, 0.22);
      border-radius: 50%;
      border-top-color: #f5c542;
      content: "";
      inset: 0;
      position: absolute;
    }

    .app-loading-brand {
      color: #f5c542;
      font: 800 12px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0 0 9px;
    }

    .app-loading-stage {
      color: #f5f5f5;
      font: 650 17px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 23px;
      text-align: center;
    }

    .app-loading-detail {
      color: #8f9399;
      font: 400 12px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 7px 0 0;
      min-height: 18px;
      text-align: center;
    }

    .app-loading-progress {
      background: #25272b;
      height: 4px;
      margin-top: 24px;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .app-loading-progress-fill {
      background: #f5c542;
      height: 100%;
      transform: scaleX(var(--loading-progress, 0));
      transform-origin: left center;
      transition: transform 140ms ease-out;
      width: 100%;
    }

    .app-loading-progress.measuring .app-loading-progress-fill {
      animation: loading-measure 1.1s ease-in-out infinite;
      transform: translateX(-120%);
      width: 42%;
    }

    .app-loading-bytes {
      color: #aeb1b6;
      display: flex;
      font: 500 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      justify-content: space-between;
      margin-top: 9px;
      min-height: 16px;
      width: 100%;
    }

    .app-loading-network {
      color: #d3a9ff;
      font: 600 11px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 15px 0 0;
      min-height: 16px;
      text-align: center;
    }

    .app-loading-retry {
      background: #f5c542;
      border: 0;
      border-radius: 4px;
      color: #111214;
      cursor: pointer;
      font: 750 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin-top: 16px;
      min-height: 38px;
      padding: 0 18px;
    }

    .app-loading-retry:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }

    #app-loading.failed .app-loading-logo::after {
      animation: none;
      border-color: #ff7575;
    }

    #app-loading.failed .app-loading-stage {
      color: #ff9b9b;
    }

    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes loading-measure {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(340%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loading-logo::after,
      .app-loading-progress.measuring .app-loading-progress-fill {
        animation: none;
      }

      .app-loading-progress.measuring .app-loading-progress-fill {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite" aria-label="Loading ZZZ IM">
    <div class="app-loading-content">
      <div class="app-loading-logo" aria-hidden="true">
        <img src="icons/Icon-192.png" alt="">
      </div>
      <p class="app-loading-brand">ZZZ IM</p>
      <p id="app-loading-stage" class="app-loading-stage">Preparing application</p>
      <p id="app-loading-detail" class="app-loading-detail">Checking local files</p>
      <div id="app-loading-progress" class="app-loading-progress measuring" role="progressbar" aria-label="Application download progress">
        <div class="app-loading-progress-fill"></div>
      </div>
      <div class="app-loading-bytes" aria-hidden="true">
        <span id="app-loading-bytes">Measuring download</span>
        <span id="app-loading-percent"></span>
      </div>
      <p id="app-loading-network" class="app-loading-network"></p>
      <button id="app-loading-retry" class="app-loading-retry" type="button" hidden>Retry</button>
    </div>
  </div>
  <script src="loading.js"></script>
  <script src="push_client.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
