name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Validate PWA assets
        run: |
          node --check web/push_client.js
          node --check web/push-sw.js
          node -e "JSON.parse(require('fs').readFileSync('web/manifest.json', 'utf8'))"

      - name: Build Web release
        env:
          ZZZ_SERVER_URL: ${{ vars.ZZZ_SERVER_URL }}
        run: |
          build_args=(--release --base-href /zzzproject/)
          if [[ -n "$ZZZ_SERVER_URL" ]]; then
            build_args+=(--dart-define="ZZZ_SERVER_URL=$ZZZ_SERVER_URL")
          fi
          flutter build web "${build_args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
          if-no-files-found: error
          retention-days: 7

  server:
    name: Go server test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./internal/gateway ./internal/store ./internal/media

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [flutter, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-release
          path: build/web

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
