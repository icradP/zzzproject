name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Test Web plugin registration
        run: flutter test --platform chrome test/im_web_plugin_registration_test.dart

      - name: Validate PWA assets
        run: |
          node --check web/app-sw.js
          node --check web/loading.js
          node --check web/push_client.js
          node --check web/push-sw.js
          node --check tool/generate_web_asset_manifest.mjs
          node --test tool/*_test.*
          node -e "JSON.parse(require('fs').readFileSync('web/manifest.json', 'utf8'))"

      - name: Build Web release
        env:
          ZZZ_SERVER_URL: ${{ vars.ZZZ_SERVER_URL || 'wss://icrad.ltd/im/ws' }}
        run: |
          build_args=(--release --base-href /zzzproject/ --no-web-resources-cdn)
          if [[ -n "$ZZZ_SERVER_URL" ]]; then
            build_args+=(--dart-define="ZZZ_SERVER_URL=$ZZZ_SERVER_URL")
          fi
          flutter build web "${build_args[@]}"
          node tool/generate_web_asset_manifest.mjs build/web

      - name: Validate optimized Web release
        run: |
          node --check build/web/app-sw.js
          node --check build/web/flutter_bootstrap.js
          node --check build/web/loading.js
          node -e "JSON.parse(require('fs').readFileSync('build/web/startup-assets.json', 'utf8'))"
          grep -Fq 'canvasKitBaseUrl: "canvaskit/"' build/web/flutter_bootstrap.js
          grep -Fq 'record.worklet.js' build/web/main.dart.js
          grep -Fq 'geolocation' build/web/main.dart.js
          test -f build/web/canvaskit/canvaskit.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
          if-no-files-found: error
          retention-days: 7

  server:
    name: Go server test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - run: go test ./...
      - run: go vet ./...
      - run: go build -o /tmp/zzz-im-fairy ./cmd/fairy
      - run: go test -race ./internal/admin ./internal/fairy ./internal/gateway ./internal/store ./internal/media

      - name: Validate admin console assets
        run: node --check internal/admin/assets/app.js

      - name: Build server container
        run: docker build -t zzz-im-server:test .

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [flutter, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-release
          path: build/web

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
