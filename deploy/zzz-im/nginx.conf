limit_req_zone $binary_remote_addr zone=zzz_im_ws:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name icrad.ltd www.icrad.ltd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name icrad.ltd www.icrad.ltd;

    ssl_certificate /etc/nginx/ssl/icrad.ltd/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/icrad.ltd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:icrad_tls:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /srv/www/zzz-im/current;
    index index.html;

    location = /im/ws {
        limit_req zone=zzz_im_ws burst=10 nodelay;
        proxy_pass http://127.0.0.1:18080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location = /im/health {
        proxy_pass http://127.0.0.1:18080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
